    main.appendChild(el('p', 'lead', C.resultSub));
    main.appendChild(el('p', 'verdict', S.score >= C.highFrom ? C.resultHigh : C.resultLow));
    R.forEach(function(r, i){ var L = S.log[i]; if (!L) return; var ord = order(r); var blk = el('div', 'roundblock'); blk.appendChild(el('p', 'eyebrow', fill(C.roundLabel, { n:i + 1, total:R.length }))); blk.appendChild(el('h2', null, r.job)); blk.appendChild(podium(r, ord, L.pick, true)); var re = el('div', 'reason'); re.appendChild(el('b', null, C.reasonRow + ':')); re.appendChild(el('span', 'chip ' + (L.gotWhy ? 'ok' : 'no'), L.gotWhy ? C.logRight : C.logMissed)); re.appendChild(el('span', null, r.why.options.filter(function(o){ return o.side === r.winner; })[0].text)); blk.appendChild(re); main.appendChild(blk); });
    var cta = el('div', 'cta'); cta.appendChild(el('p', 'eyebrow', C.brand)); cta.appendChild(el('h2', null, C.cta.heading)); cta.appendChild(el('p', null, C.cta.copy));
    /* Booking destination is configuration. Confirm the live link before release. */
    var a = el('a', 'btn', C.cta.button); a.href = C.cta.url; a.target = '_blank'; a.rel = 'noopener'; cta.appendChild(a); main.appendChild(cta);
    var acts = el('div', 'actions');
    var share = el('button', 'btn ghost', C.share); share.type = 'button'; share.addEventListener('click', function(){ var url = location.href.split('#')[0]; var done = function(){ share.textContent = C.shared; setTimeout(function(){ share.textContent = C.share; }, 1800); }; if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(done, function(){ window.prompt(C.share, url); }); } else { window.prompt(C.share, url); } });
    var print = el('button', 'btn ghost', C.print); print.type = 'button'; print.addEventListener('click', function(){ window.print(); });
    var over = el('button', 'btn ghost', C.startOver); over.type = 'button'; over.addEventListener('click', function(){ S = { step:'landing', round:0, pick:null, display:{}, optOrder:{}, whyPick:null, score:0, streak:0, log:[] }; history.replaceState(null, '', location.pathname); go('landing'); });
    acts.appendChild(share); acts.appendChild(print); acts.appendChild(over); main.appendChild(acts);
    countUp(n, 400); if (S.score >= C.highFrom) setTimeout(confetti, 600);
  }

  var screens = { landing:landing, pick:pick, reveal:reveal, why:why, whyreveal:whyreveal, result:result };
  function render(animate){ main.innerHTML = ''; main.classList.toggle('anim', animate !== false); screens[S.step](); Array.prototype.forEach.call(main.children, function(c, i){ c.style.setProperty('--i', i); }); bar(); hud(); }
  function go(step){ if (reduced) { S.step = step; render(true); focusTitle(); return; } main.classList.add('leave'); setTimeout(function(){ S.step = step; main.classList.remove('leave'); render(true); focusTitle(); }, 170); }

  $('brand').textContent = C.brand;
  $('foot').innerHTML = C.brand + ' · <a href="https://talexmedia.com">talexmedia.com</a> · <a href="mailto:info@talexmedia.com">info@talexmedia.com</a>';
  /* deep links: #r3 opens round three's pick step */
  var m = /^#r(\d+)$/.exec(location.hash);
  if (m && R[parseInt(m[1], 10) - 1]) { S.round = parseInt(m[1], 10) - 1; S.step = 'pick'; }
  render(true);
  window.__rounds = { state:function(){ return JSON.parse(JSON.stringify(S)); }, order:function(i){ return order(R[i]); }, nameOf:nameOf, go:go, sides:function(i){ return R[i].sides; } };
})();
</script>
